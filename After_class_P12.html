    <style>
        div.fixed{
            position:fixed;
            right:50px;
            padding:10px;
            border: 3px solid #73AD21;
            background-color: darkgreen;
            color:rgb(255, 255, 255);
            font-size:20px;
            }
        div.sticky{

            padding:10px;
            border: 3px solid #73AD21;

            font-size:20px;

        div.absolute{

            padding:10px;
            border: 3px solid #000000;
            background-color: rgb(255, 255, 255);
            color:rgb(0, 0, 0);
            opacity:0.25;
        }
        div.absolute:hover{
            opacity:1;
        }
        div.card:hover{
            opacity:1;
        }
        div.relative{
            position:relative;
            left:25px;
            padding:4px;
            border:2px solid #73AD21;
            background-color:#93ffcc
        }
        p.normal{

            border:2px solid #72a728;
            background-color:#0f834d
        }
        .card {

            background: white;
            border: 2px solid #52b788;
            border-radius: 1px;
            padding: 2px;
            text-align: center;
            opacity:0.25;
        }
        dl{

            padding: 3px;

        body{

        }
    </style>
</head>
